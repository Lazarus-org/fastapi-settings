[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-settings"
version = "1.0.0"
description = "Lazy, centralized settings for Python and FastAPI applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  {name = "ARYAN-NIKNEZHAD", email = "aryan513966@gmail.com"},
  {name = "MEHRSHAD-MIRSHEKARY", email = "mehrshad_mirshekary@email.com"},
]
keywords = ["fastapi", "settings", "configuration", "lazy", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Lazarus-org/fastapi-settings"
Documentation = "https://github.com/Lazarus-org/fastapi-settings#readme"
Issues = "https://github.com/Lazarus-org/fastapi-settings/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "fastapi>=0.115", "pydantic-settings>=2", "httpx>=0.27"]
quality = [
  "ruff==0.17.3", "mypy", "build", "twine", "commitizen>=4,<5",
  "pre-commit>=4,<5", "tox>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastapi_settings = ["py.typed"]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "RUF", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
