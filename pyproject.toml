[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.6,<0.14" ]

[project]
name = "fastapi-settings"
version = "1.0.0"
description = "Lazy, centralized settings for Python and FastAPI applications"
readme = "README.md"
keywords = [ "configuration", "fastapi", "lazy", "settings", "testing" ]
license = "MIT"
license-files = [ "LICENSE", "AUTHORS.md" ]
authors = [
  { name = "ARYAN-NIKNEZHAD", email = "aryan513966@gmail.com" },
  { name = "MEHRSHAD-MIRSHEKARY", email = "mehrshad_mirshekary@email.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
optional-dependencies.quality = [
  "bandit[toml]>=1.9.4,<2",
  "commitizen>=4.19.3,<5",
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pyproject-fmt>=2.30.3,<3",
  "ruff==0.17.3",
  "tox>=4.67.1,<5",
  "tox-ini-fmt>=1.10,<2",
  "tox-uv>=1.37,<2",
  "twine>=7,<8",
]
optional-dependencies.test = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7.1,<8",
]
urls.Changelog = """\
  https://github.com/Lazarus-org/fastapi-settings/blob/main/CHANGELOG.md\
  """
urls.Documentation = "https://github.com/Lazarus-org/fastapi-settings#readme"
urls.Issues = "https://github.com/Lazarus-org/fastapi-settings/issues"
urls.Repository = "https://github.com/Lazarus-org/fastapi-settings"

[dependency-groups]
# Default uv setup; keep aligned with the extras used by tox and archive validation.
dev = [
  "bandit[toml]>=1.9.4,<2",
  "commitizen>=4.19.3,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pydantic-settings>=2,<3",
  "pyproject-fmt>=2.30.3,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7.1,<8",
  "ruff==0.17.3",
  "tox>=4.67.1,<5",
  "tox-ini-fmt>=1.10,<2",
  "tox-uv>=1.37,<2",
  "twine>=7,<8",
]

[tool.uv]
required-version = ">=0.13.6"
build-backend.module-name = "fastapi_settings"
build-backend.module-root = "src"
build-backend.source-exclude = [
  ".git",
  ".idea",
  ".venv",
  ".tox",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "build",
  "dist",
  "*.pyc",
  "*.pyo",
  ".DS_Store",
  ".env",
  ".env.*",
]
build-backend.source-include = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CONTRIBUTORS.md",
  "CODE_OF_CONDUCT.md",
  "uv.lock",
  "tox.ini",
  ".pre-commit-config.yaml",
  ".gitignore",
  ".gitattributes",
  "tests/**/*.py",
  "examples/**/*.py",
  "examples/**/*.md",
  ".github/scripts/*.py",
  ".github/workflows/*.yml",
  ".github/workflows/*.yaml",
  ".github/dependabot.yml",
]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"
line-length = 88
lint.select = [ "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM" ]

[tool.pyproject-fmt]
column_width = 88
keep_full_version = true
generate_python_version_classifiers = false

[tool.bandit]
targets = [ "src/fastapi_settings" ]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra --strict-config --strict-markers"
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "strict"

[tool.coverage]
run.source = [ "fastapi_settings" ]
run.branch = true
run.patch = [ "subprocess" ]
paths.source = [ "src/fastapi_settings", "*/site-packages/fastapi_settings" ]
report.fail_under = 100
report.skip_covered = true
report.show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
