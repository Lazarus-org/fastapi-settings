[tox]
min_version = 4.0
env_list = py311, py312, py313, py314, py315, lint, type, build
skip_missing_interpreters = false

[testenv]
description = Run the full suite on {base_python}
package = wheel
extras = test
set_env =
    PYTHONDONTWRITEBYTECODE = 1
commands = python -m pytest {posargs:tests}

[testenv:lint]
description = Check Python lint and formatting
skip_install = true
deps = ruff==0.17.3
commands =
    python -m ruff check src tests examples .github/scripts
    python -m ruff format --check src tests examples .github/scripts

[testenv:type]
description = Check core type annotations
skip_install = true
deps = mypy
commands = python -m mypy src/

[testenv:build]
description = Validate distributions, archive tests, and clean-wheel operation
package = wheel
extras = test
deps =
    build
    twine
commands =
    python -m build --outdir {env_tmp_dir}/dist
    python -m twine check --strict {env_tmp_dir}/dist/*
    python .github/scripts/validate_distribution.py {env_tmp_dir}/dist --test-sdist
