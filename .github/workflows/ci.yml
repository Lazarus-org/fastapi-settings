name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: CPython ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build
      - name: Verify interpreter and integration dependencies
        run: |
          python -c "import sys, fastapi, httpx, pydantic_settings; assert sys.implementation.name == 'cpython'; print(sys.version)"
      - name: Run the full test suite
        run: python -m pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify distributions and dependency isolation
        run: python .github/scripts/validate_distribution.py dist --test-sdist

  quality:
    name: Lint, types, hooks, and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,quality]"
      - name: Lint
        run: ruff check src tests examples .github/scripts
      - name: Formatting
        run: ruff format --check src tests examples .github/scripts
      - name: Type check
        run: mypy src/
      - name: Pre-commit checks
        run: python -m pre_commit run --all-files
      - name: Build distributions for metadata validation
        run: python -m build
      - name: Check PyPI metadata and description
        run: python -m twine check --strict dist/*
