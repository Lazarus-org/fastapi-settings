name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: CPython ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install package and test dependencies
        run: |
          uv sync --locked --python "${{ matrix.python-version }}"
      - name: Verify interpreter and integration dependencies
        run: |
          uv run --no-sync python -c "import sys, fastapi, httpx, pydantic_settings; assert sys.implementation.name == 'cpython'; print(sys.version)"
      - name: Run the full test suite with 100% coverage
        run: uv run --no-sync python -m pytest --cov=fastapi_settings
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify distributions and dependency isolation
        run: uv run --no-sync python .github/scripts/validate_distribution.py dist --test-sdist

  quality:
    name: Lint, types, hooks, and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          uv sync --locked --python 3.13
      - name: Lint
        run: uv run --no-sync ruff check src tests examples .github/scripts
      - name: Formatting
        run: uv run --no-sync ruff format --check src tests examples .github/scripts
      - name: Type check
        run: uv run --no-sync mypy src/
      - name: Pre-commit checks
        run: uv run --no-sync python -m pre_commit run --all-files
      - name: Build distributions for metadata validation
        run: uv build
      - name: Check PyPI metadata and description
        run: uv run --no-sync python -m twine check --strict dist/*
